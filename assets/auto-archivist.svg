<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-label="Auto-Archivist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151040"/>
      <stop offset="0.55" stop-color="#1a1248"/>
      <stop offset="1" stop-color="#2b1f66"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#6a5cf0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.78" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#6a5cf0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6a5cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.04" cy="1" r="0.65">
      <stop offset="0" stop-color="#7cc0ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7cc0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0a0820" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#glowA)"/>
  <rect width="640" height="640" fill="url(#glowB)"/>

  <!-- faint data-point texture -->
  <g fill="#a89bff">
    <circle cx="96" cy="96" r="3" opacity="0.25"/>
    <circle cx="560" cy="120" r="3" opacity="0.22"/>
    <circle cx="110" cy="540" r="3" opacity="0.22"/>
    <circle cx="548" cy="500" r="3" opacity="0.25"/>
  </g>

  <!-- knowledge-graph links -->
  <g stroke="#8b7cff" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M470 170 L170 180"/>
    <path d="M170 180 L180 440"/>
    <path d="M180 440 L460 430"/>
    <path d="M460 430 L470 170"/>
  </g>

  <!-- archive cabinet -->
  <g filter="url(#shadow)">
    <rect x="200" y="200" width="240" height="240" rx="28" fill="#ffffff"/>
  </g>
  <rect x="220" y="220" width="200" height="60" rx="10" fill="#f0f2fb"/>
  <rect x="220" y="290" width="200" height="60" rx="10" fill="#f0f2fb"/>
  <rect x="220" y="360" width="200" height="60" rx="10" fill="#f0f2fb"/>
  <rect x="297" y="247" width="46" height="7" rx="3.5" fill="url(#accent)"/>
  <rect x="297" y="317" width="46" height="7" rx="3.5" fill="url(#accent)"/>
  <rect x="297" y="387" width="46" height="7" rx="3.5" fill="url(#accent)"/>

  <!-- graph nodes -->
  <circle cx="470" cy="170" r="16" fill="#7cc0ff" opacity="0.18"/>
  <circle cx="470" cy="170" r="10" fill="#7cc0ff"/>
  <circle cx="170" cy="180" r="9" fill="#8b7cff"/>
  <circle cx="180" cy="440" r="10" fill="#ffffff" opacity="0.92"/>
  <circle cx="460" cy="430" r="8" fill="#7cc0ff"/>

  <!-- automation sparkle -->
  <path d="M520 92 L524 110 L542 114 L524 118 L520 136 L516 118 L498 114 L516 110 Z" fill="#7cc0ff" opacity="0.9"/>
</svg>
